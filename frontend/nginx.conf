server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for any route that isn't a real file,
    # so client-side routing (and page refreshes on /login, /trips, etc.) works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
